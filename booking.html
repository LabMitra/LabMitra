<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="theme-color" content="#123b69"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Book a test | LabMitra</title><link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg?v=1793977282"><link rel="stylesheet" href="assets/style.css?v=1793977282"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><img class="logo" src="assets/logo-mark.svg?v=1793977282" alt="" width="38" height="38"><span class="wordmark">Lab<b>Mitra</b></span></a><a class="btn light" href="cart.html">← Back to cart</a></div></header><main class="wrap"><div class="form-card"><h1 class="page-title">Book home collection</h1><p class="sub">Enter patient and collection details. Pay online now or in cash when we visit.</p><div id="selectedTest" style="margin:18px 0"></div><div id="prepNotice"></div><form id="bookingForm"><label style="margin-top:0">Who is this test for?</label><div id="memberPicker" class="member-picker"></div><div class="form-grid"><div><label>Patient full name</label><input name="name" placeholder="Enter full name" required></div><div><label>Mobile number</label><input name="phone" placeholder="10-digit mobile number" pattern="[0-9 ]{10,13}" required></div><div><label>Patient age</label><div class="age-input"><input name="age" type="number" min="0" max="120" inputmode="numeric" placeholder="Age" required><select name="ageUnit" aria-label="Age unit"><option value="years">Years</option><option value="months">Months</option><option value="days">Days</option></select></div></div><div><label>Patient gender</label><select name="gender" required><option value="">Select gender</option><option>Male</option><option>Female</option><option>Other</option></select></div><div><label>Collection date</label><input type="date" name="date" required></div><div><label>Preferred time slot</label><select name="slot" required><option value="">Select slot</option><option>7:00–8:00 AM</option><option>8:00–9:00 AM</option><option>9:00–10:00 AM</option><option>10:00–11:00 AM</option></select><small class="muted" id="slotHint" style="display:block;margin-top:6px;font-size:12px">Pick a date to see open slots.</small></div></div><p class="muted" style="font-size:12px;margin:8px 0 0">Age and gender are needed by the lab to show the correct normal ranges on the report.</p>
<label style="margin-top:18px">Collection address</label>
<div id="savedAddresses" style="margin:10px 0"></div>
<div id="newAddressForm">
  <div class="form-grid"><div><label>Label (optional)</label><input name="addrLabel" placeholder="e.g. Home, Office"></div><div><label>Area / locality</label><input name="area" placeholder="e.g. Shankar Nagar" required></div></div>
  <label>Full address</label><textarea name="address" rows="3" placeholder="House no., street, landmark..." required></textarea>
  <div class="addr-actions"><button type="button" class="light" id="useLocationBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg><span>Use current location</span></button><label class="save-addr-check"><input type="checkbox" name="saveAddr" checked> Save this address for next time</label></div>
</div>
<label style="margin-top:18px">Payment</label>
<div class="pay-options">
  <label class="pay-option"><input type="radio" name="paymethod" value="Online" checked><div class="pay-option-body"><b>Pay online</b><span class="muted">Razorpay · UPI, cards, netbanking</span></div></label>
  <label class="pay-option"><input type="radio" name="paymethod" value="Cash"><div class="pay-option-body"><b>Pay on arrival</b><span class="muted">Cash to our staff at collection</span></div></label>
</div>
<label class="consent-check"><input type="checkbox" name="consent" required> <span>I agree to the <a href="privacy.html" target="_blank">Privacy Policy</a> and consent to LabMitra and its partner lab using this patient's details and health information to carry out the test and deliver the report. If I'm booking for someone else, I have their permission (or I'm their parent or guardian).</span></label>
<button class="green" id="confirmBtn" style="width:100%;margin-top:14px">Confirm booking</button></form></div></main><footer class="footer"><div class="wrap">© LabMitra · <a href="privacy.html">Privacy Policy</a></div></footer><div class="toast"></div><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="assets/supabase.js"></script><script src="assets/app.js?v=1793977282"></script></body></html>
