<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LabMitra">
  <defs>
    <linearGradient id="lm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b69"/>
      <stop offset="1" stop-color="#1d70b7"/>
    </linearGradient>
    <linearGradient id="lm-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lm-badge"><rect width="64" height="64" rx="16"/></clipPath>
  </defs>
  <style>
    /* Soft "heartbeat" of the cross, and a glossy shine across the badge now and then. */
    .lm-cross{transform-origin:32px 39.5px;animation:lm-beat 3.6s ease-in-out infinite}
    @keyframes lm-beat{0%,58%,100%{transform:scale(1)}64%{transform:scale(1.16)}70%{transform:scale(.97)}76%{transform:scale(1.09)}84%{transform:scale(1)}}
    .lm-sweep{animation:lm-sweep 6s ease-in-out infinite}
    @keyframes lm-sweep{0%,62%{transform:translateX(-70px)}88%,100%{transform:translateX(90px)}}
    @media (prefers-reduced-motion:reduce){.lm-cross,.lm-sweep{animation:none}.lm-sweep{opacity:0}}
  </style>
  <!-- badge -->
  <rect width="64" height="64" rx="16" fill="url(#lm-bg)"/>
  <!-- blood drop -->
  <path d="M32 10.5C32 10.5 16.5 27.5 16.5 38.5a15.5 15.5 0 0 0 31 0C47.5 27.5 32 10.5 32 10.5Z" fill="#fff"/>
  <path d="M23.2 37.5c.2-4.4 2.6-9 5.4-13" fill="none" stroke="#cfe3f6" stroke-width="2.6" stroke-linecap="round"/>
  <!-- medical cross -->
  <g class="lm-cross">
    <rect x="29.6" y="32" width="4.8" height="15" rx="2.2" fill="#13834e"/>
    <rect x="24.5" y="37.1" width="15" height="4.8" rx="2.2" fill="#13834e"/>
  </g>
  <!-- glossy shine -->
  <g clip-path="url(#lm-badge)"><g transform="skewX(-20)"><rect class="lm-sweep" x="0" y="-4" width="22" height="72" fill="url(#lm-shine)"/></g></g>
</svg>
